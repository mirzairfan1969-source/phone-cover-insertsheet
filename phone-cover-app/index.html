<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Cover Insert Sheet Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #1e293b; color: white; padding: 15px; }
    .container { max-width: 1500px; margin: 0 auto; }
    h1 { margin-bottom: 5px; font-size: 24px; }
    .subtitle { color: #94a3b8; margin-bottom: 15px; font-size: 12px; }
    .content { display: grid; grid-template-columns: 280px 1fr; gap: 15px; }
    .controls { background: #334155; padding: 15px; border-radius: 8px; border: 1px solid #475569; height: fit-content; max-height: 95vh; overflow-y: auto; }
    .preview { background: #334155; padding: 15px; border-radius: 8px; border: 1px solid #475569; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 11px; color: #cbd5e1; margin-bottom: 5px; font-weight: bold; }
    select, input[type="range"] { width: 100%; background: #475569; border: 1px solid #64748b; border-radius: 5px; padding: 6px; color: white; font-size: 11px; }
    select:focus { outline: none; border-color: #2563eb; }
    input[type="range"] { padding: 0; }
    .range-label { display: flex; justify-content: space-between; font-size: 10px; color: #94a3b8; margin-top: 3px; }
    .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
    .btn { padding: 8px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 11px; transition: all 0.3s; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #475569; color: white; }
    .btn-secondary:hover:not(:disabled) { background: #64748b; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .canvas-container { background: white; border-radius: 6px; border: 1px solid #cbd5e1; padding: 10px; overflow: auto; max-height: 750px; text-align: center; }
    canvas { max-width: 100%; display: inline-block; margin: 5px; border: 1px solid #e2e8f0; }
    .upload-area { border: 2px dashed #64748b; border-radius: 6px; padding: 12px; text-align: center; cursor: pointer; }
    .upload-area:hover { border-color: #2563eb; }
    .phone-info { font-size: 10px; color: #94a3b8; margin-top: 4px; }
    .sheets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .sheets-grid .btn { padding: 6px; font-size: 10px; }
    .status-text { font-size: 10px; color: #4ade80; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📱 Phone Cover Insert Sheet</h1>
    <p class="subtitle">Landscape • Corner-aligned • 1-4 sheets on single page • Camera & Fingerprint cutouts</p>
    
    <div class="content">
      <div class="controls">
        <div class="form-group">
          <label>📱 Brand</label>
          <select id="company" onchange="updateModels()">
            <option value="">Select Brand...</option>
          </select>
        </div>

        <div class="form-group">
          <label>📲 Model</label>
          <select id="model" onchange="updatePhoneInfo()">
            <option value="">Select Model...</option>
          </select>
          <div class="phone-info" id="phoneInfo"></div>
        </div>

        <div class="form-group">
          <label>🖼️ Upload Image</label>
          <div class="upload-area" onclick="document.getElementById('imageInput').click()">
            <div style="font-weight: bold; font-size: 11px;">Click to upload</div>
            <div style="font-size: 9px; color: #94a3b8;">JPG or PNG</div>
          </div>
          <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload()" style="display: none;">
          <div id="imageStatus" class="status-text" style="display: none;">✓ Ready</div>
        </div>

        <div id="adjustments" style="display: none;">
          <div class="form-group">
            <label>Horizontal</label>
            <input type="range" id="offsetX" min="-100" max="100" value="0" oninput="updatePreview(); updateLabel('xValue', this.value);">
            <div class="range-label"><span>-100</span><span id="xValue">0</span><span>+100</span></div>
          </div>

          <div class="form-group">
            <label>Vertical</label>
            <input type="range" id="offsetY" min="-100" max="100" value="0" oninput="updatePreview(); updateLabel('yValue', this.value);">
            <div class="range-label"><span>-100</span><span id="yValue">0</span><span>+100</span></div>
          </div>

          <div class="form-group">
            <label>Scale</label>
            <input type="range" id="scale" min="0.8" max="2" step="0.05" value="1" oninput="updatePreview(); updateLabel('scaleValue', parseFloat(this.value).toFixed(2));">
            <div class="range-label"><span>0.8</span><span id="scaleValue">1.00</span><span>2.0</span></div>
          </div>
        </div>

        <div class="form-group">
          <label>📄 Sheets</label>
          <div class="sheets-grid">
            <button class="btn btn-secondary" onclick="setSheetsPerPage(1)" id="btn1">1</button>
            <button class="btn btn-secondary" onclick="setSheetsPerPage(2)" id="btn2">2</button>
            <button class="btn btn-secondary" onclick="setSheetsPerPage(3)" id="btn3">3</button>
            <button class="btn btn-secondary" onclick="setSheetsPerPage(4)" id="btn4">4</button>
          </div>
        </div>

        <div class="button-group">
          <button class="btn btn-primary" id="exportBtn" onclick="generatePDF()" disabled>📥 PDF</button>
          <button class="btn btn-secondary" id="clearBtn" onclick="clearAll()" style="display:none;">🔄 Clear</button>
        </div>
      </div>

      <div class="preview">
        <div class="canvas-container" id="canvasContainer">
          <p style="color: #94a3b8; padding: 30px;">Upload image to preview</p>
        </div>
      </div>
    </div>
  </div>

        'HTC Desire 24 Pro': { width: 72.5, height: 162.0, camera: {x: 64, y: 12, w: 13, h: 13}, fingerprint: 'back' },
      },
    };

    let currentImage = null;
    let sheetsPerPage = 2;

    function updateLabel(id, val) {
      document.getElementById(id).textContent = val;
    }

    function loadBrands() {
      const sel = document.getElementById('company');
      Object.keys(phones).sort().forEach(b => {
        const opt = document.createElement('option');
        opt.value = b;
        opt.textContent = b;
        sel.appendChild(opt);
      });
    }

    function updateModels() {
      const brand = document.getElementById('company').value;
      const modelSel = document.getElementById('model');
      modelSel.innerHTML = '<option value="">Select Model...</option>';
      if (!brand || !phones[brand]) return;
      Object.keys(phones[brand]).sort().forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        modelSel.appendChild(opt);
      });
      updatePhoneInfo();
    }

    function updatePhoneInfo() {
      const brand = document.getElementById('company').value;
      const model = document.getElementById('model').value;
      if (!brand || !model || !phones[brand] || !phones[brand][model]) {
        document.getElementById('phoneInfo').textContent = '';
        return;
      }
      const p = phones[brand][model];
      document.getElementById('phoneInfo').textContent = `${p.width.toFixed(1)}mm × ${p.height.toFixed(1)}mm`;
    }

    function handleImageUpload() {
      const file = document.getElementById('imageInput').files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          currentImage = img;
          document.getElementById('imageStatus').style.display = 'block';
          document.getElementById('adjustments').style.display = 'block';
          document.getElementById('exportBtn').disabled = false;
          document.getElementById('clearBtn').style.display = 'inline-block';
          updatePreview();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function setSheetsPerPage(n) {
      sheetsPerPage = n;
      [1,2,3,4].forEach(i => {
        document.getElementById('btn' + i).className = 'btn btn-secondary';
      });
      document.getElementById('btn' + n).className = 'btn btn-primary';
      if (currentImage) updatePreview();
    }

    function getPositions(pw, ph, margin) {
      const spacing = 3;
      let positions = [];
      
      if (sheetsPerPage === 1) {
        // Top-left corner
        positions = [{x: margin, y: margin}];
      } else if (sheetsPerPage === 2) {
        // Top-left + top-right (side by side)
        positions = [
          {x: margin, y: margin},
          {x: margin + pw + spacing, y: margin}
        ];
      } else if (sheetsPerPage === 3) {
        // Top-left, top-right, bottom-left
        positions = [
          {x: margin, y: margin},
          {x: margin + pw + spacing, y: margin},
          {x: margin, y: margin + ph + spacing}
        ];
      } else if (sheetsPerPage === 4) {
        // 2x2 grid
        positions = [
          {x: margin, y: margin},
          {x: margin + pw + spacing, y: margin},
          {x: margin, y: margin + ph + spacing},
          {x: margin + pw + spacing, y: margin + ph + spacing}
        ];
      }
      
      return positions;
    }

    function drawCutouts(ctx, phone, pw, ph, px, py) {
      if (!phone.camera) return;
      
      const cam = phone.camera;
      const camX = px + (cam.x * pw / phone.width);
      const camY = py + (cam.y * ph / phone.height);
      const camR = (cam.w * pw / phone.width) / 2;
      
      ctx.strokeStyle = '#ff4444';
      ctx.lineWidth = 0.5;
      ctx.setLineDash([2, 2]);
      ctx.beginPath();
      ctx.arc(camX, camY, camR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      
      if (phone.fingerprint === 'back') {
        const fpY = py + ph - 15;
        ctx.strokeStyle = '#4444ff';
        ctx.lineWidth = 0.5;
        ctx.setLineDash([2, 2]);
        ctx.beginPath();
        ctx.ellipse(px + pw/2, fpY, 8, 12, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    function updatePreview() {
      if (!currentImage) return;
      const brand = document.getElementById('company').value;
      const model = document.getElementById('model').value;
      if (!brand || !model || !phones[brand] || !phones[brand][model]) return;
      
      const phone = phones[brand][model];
      const offsetX = parseInt(document.getElementById('offsetX').value);
      const offsetY = parseInt(document.getElementById('offsetY').value);
      const scale = parseFloat(document.getElementById('scale').value);

      const container = document.getElementById('canvasContainer');
      container.innerHTML = '';

      const pageW = 297, pageH = 210, margin = 2, dpi = 96, mmPx = dpi / 25.4;
      const pw = phone.width * mmPx, ph = phone.height * mmPx;
      const positions = getPositions(pw, ph, margin * mmPx);

      const canvas = document.createElement('canvas');
      canvas.width = pageW * mmPx;
      canvas.height = pageH * mmPx;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      positions.forEach(p => {
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.fillStyle = '#f5f5f5';
        ctx.fillRect(p.x, p.y, pw, ph);
        ctx.strokeRect(p.x, p.y, pw, ph);

        if (currentImage) {
          const iw = pw * scale, ih = ph * scale;
          const ix = p.x + (pw - iw) / 2 + offsetX;
          const iy = p.y + (ph - ih) / 2 + offsetY;

          ctx.save();
          ctx.beginPath();
          ctx.rect(p.x, p.y, pw, ph);
          ctx.clip();
          ctx.drawImage(currentImage, ix, iy, iw, ih);
          ctx.restore();
        }

        drawCutouts(ctx, phone, pw, ph, p.x, p.y);

        const mk = 6;
        ctx.strokeStyle = '#666';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y + mk);
        ctx.lineTo(p.x, p.y);
        ctx.lineTo(p.x + mk, p.y);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(p.x + pw - mk, p.y);
        ctx.lineTo(p.x + pw, p.y);
        ctx.lineTo(p.x + pw, p.y + mk);
        ctx.stroke();
      });

      container.appendChild(canvas);
    }

    function generatePDF() {
      if (!currentImage) return;
      const brand = document.getElementById('company').value;
      const model = document.getElementById('model').value;
      if (!brand || !model || !phones[brand] || !phones[brand][model]) return;

      const phone = phones[brand][model];
      const offsetX = parseInt(document.getElementById('offsetX').value);
      const offsetY = parseInt(document.getElementById('offsetY').value);
      const scale = parseFloat(document.getElementById('scale').value);

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('landscape', 'mm', 'a4');
      const pw = phone.width;
      const ph = phone.height;
      const margin = 2;
      const positions = getPositions(pw, ph, margin);

      positions.forEach(p => {
        const dpi = 96, mmPx = dpi / 25.4;
        const c = document.createElement('canvas');
        c.width = pw * mmPx;
        c.height = ph * mmPx;
        const cx = c.getContext('2d');

        const iw = pw * scale, ih = ph * scale;
        const ix = (pw - iw) / 2 + offsetX / mmPx;
        const iy = (ph - ih) / 2 + offsetY / mmPx;

        cx.save();
        cx.beginPath();
        cx.rect(0, 0, pw * mmPx, ph * mmPx);
        cx.clip();
        cx.drawImage(currentImage, ix, iy, iw, ih);
        cx.restore();

        doc.setDrawColor(0);
        doc.setLineWidth(0.3);
        doc.rect(p.x, p.y, pw, ph);
        doc.addImage(c.toDataURL('image/jpeg'), 'JPEG', p.x, p.y, pw, ph);
      });

      doc.save('phone-cover.pdf');
    }

    function clearAll() {
      document.getElementById('imageInput').value = '';
      currentImage = null;
      document.getElementById('imageStatus').style.display = 'none';
      document.getElementById('adjustments').style.display = 'none';
      document.getElementById('exportBtn').disabled = true;
      document.getElementById('clearBtn').style.display = 'none';
      document.getElementById('offsetX').value = 0;
      document.getElementById('offsetY').value = 0;
      document.getElementById('scale').value = 1;
      document.getElementById('xValue').textContent = '0';
      document.getElementById('yValue').textContent = '0';
      document.getElementById('scaleValue').textContent = '1.00';
      document.getElementById('canvasContainer').innerHTML = '<p style="color: #94a3b8; padding: 30px;">Upload image to preview</p>';
    }

    window.addEventListener('load', () => {
      loadBrands();
      setSheetsPerPage(2);
    });
  </script>
