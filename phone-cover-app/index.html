<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Cover Insert Sheet Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #1e293b; color: white; padding: 20px; }
    .container { max-width: 1400px; margin: 0 auto; }
    h1 { margin-bottom: 10px; font-size: 28px; }
    .subtitle { color: #94a3b8; margin-bottom: 30px; font-size: 14px; }
    .content { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
    .controls { background: #334155; padding: 18px; border-radius: 10px; border: 1px solid #475569; height: fit-content; max-height: 95vh; overflow-y: auto; }
    .preview { background: #334155; padding: 18px; border-radius: 10px; border: 1px solid #475569; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 6px; font-weight: bold; }
    select, input[type="file"], input[type="range"] { width: 100%; background: #475569; border: 1px solid #64748b; border-radius: 6px; padding: 8px; color: white; font-size: 12px; }
    select:focus { outline: none; border-color: #2563eb; }
    input[type="range"] { padding: 0; }
    .range-label { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; margin-top: 3px; }
    .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .btn { padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; transition: all 0.3s; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #475569; color: white; }
    .btn-secondary:hover:not(:disabled) { background: #64748b; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .canvas-container { background: white; border-radius: 8px; border: 1px solid #cbd5e1; padding: 12px; overflow: auto; max-height: 700px; text-align: center; }
    canvas { max-width: 100%; display: block; margin: 10px auto; border: 1px solid #e2e8f0; }
    .upload-area { border: 2px dashed #64748b; border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; transition: all 0.3s; }
    .upload-area:hover { border-color: #2563eb; background: rgba(37, 99, 235, 0.1); }
    .phone-info { font-size: 11px; color: #94a3b8; margin-top: 6px; }
    .sheets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .sheets-grid .btn { padding: 8px; font-size: 11px; }
    .status-text { font-size: 11px; color: #4ade80; margin-top: 6px; }
    @media (max-width: 1200px) { .content { grid-template-columns: 1fr; } .controls { max-height: none; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>📱 Phone Cover Insert Sheet Generator</h1>
    <p class="subtitle">Landscape A4 • Minimal margins • Real-time preview • 1-4 sheets per page</p>
    
    <div class="content">
      <div class="controls">
        <div class="form-group">
          <label>Phone Brand</label>
          <select id="company" onchange="updateModels()">
            <option value="">Select Brand...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Phone Model</label>
          <select id="model" onchange="updatePhoneInfo()">
            <option value="">Select Model...</option>
          </select>
          <div class="phone-info" id="phoneInfo"></div>
        </div>

        <div class="form-group">
          <label>Upload Image</label>
          <div class="upload-area" id="uploadArea" onclick="document.getElementById('imageInput').click()">
            <div style="font-weight: bold; font-size: 12px;">📷 Click to upload</div>
            <div style="font-size: 10px; color: #94a3b8;">JPG or PNG</div>
          </div>
          <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload()" style="display: none;">
          <div id="imageStatus" class="status-text" style="display: none;">✓ Image ready</div>
        </div>

        <div id="adjustments" style="display: none;">
          <div class="form-group">
            <label>Horizontal</label>
            <input type="range" id="offsetX" min="-100" max="100" value="0" oninput="updatePreview(); updateLabel('xValue', this.value);">
            <div class="range-label"><span>-100px</span><span id="xValue">0px</span><span>+100px</span></div>
          </div>

          <div class="form-group">
            <label>Vertical</label>
            <input type="range" id="offsetY" min="-100" max="100" value="0" oninput="updatePreview(); updateLabel('yValue', this.value);">
            <div class="range-label"><span>-100px</span><span id="yValue">0px</span><span>+100px</span></div>
          </div>

          <div class="form-group">
            <label>Scale</label>
            <input type="range" id="scale" min="0.8" max="2" step="0.05" value="1" oninput="updatePreview(); updateLabel('scaleValue', parseFloat(this.value).toFixed(2) + 'x');">
            <div class="range-label"><span>0.8x</span><span id="scaleValue">1.00x</span><span>2.0x</span></div>
          </div>
        </div>

        <div class="form-group">
          <label>Sheets Per Page</label>
          <div class="sheets-grid">
            <button class="btn btn-secondary" onclick="setSheetsPerPage(1)" id="btn1">1</button>
            <button class="btn btn-secondary" onclick="setSheetsPerPage(2)" id="btn2">2</button>
            <button class="btn btn-secondary" onclick="setSheetsPerPage(3)" id="btn3">3</button>
            <button class="btn btn-secondary" onclick="setSheetsPerPage(4)" id="btn4">4</button>
          </div>
        </div>

        <div class="button-group">
          <button class="btn btn-secondary" id="exportBtn" onclick="generatePDF()" disabled>📥 PDF</button>
          <button class="btn btn-primary" id="clearBtn" onclick="clearAll()" style="display:none;">🔄 Clear</button>
        </div>
      </div>

      <div class="preview">
        <div class="canvas-container" id="canvasContainer">
          <p style="color: #94a3b8; padding: 40px 20px;">Upload an image to see live preview</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const phones = {

      },

        'Realme 10': { width: 74.4, height: 162.5 },
        'Realme 9': { width: 73.3, height: 164.4 },
        'Realme GT': { width: 74.4, height: 160.8 },
        'Realme GT Neo': { width: 72.5, height: 158.5 },
      },
      'Google': {
        'Pixel 8': { width: 70.8, height: 150.5 },
        'Pixel 8 Pro': { width: 73.0, height: 162.6 },
        'Pixel 7': { width: 71.8, height: 152.0 },
        'Pixel 7 Pro': { width: 75.9, height: 163.9 },
        'Pixel 7a': { width: 72.9, height: 152.0 },
        'Pixel 6': { width: 71.8, height: 152.2 },
        'Pixel 6 Pro': { width: 75.9, height: 163.9 },
        'Pixel 6a': { width: 71.8, height: 152.2 },
        'Pixel Fold': { width: 66.0, height: 148.0 },
      },
      'Vivo': {
        'Vivo X100': { width: 75.2, height: 165.0 },
        'Vivo X100 Pro': { width: 75.2, height: 165.0 },
        'Vivo X90': { width: 75.2, height: 165.0 },
        'Vivo X90 Pro': { width: 75.2, height: 165.0 },
        'Vivo Y100': { width: 74.7, height: 164.7 },
        'Vivo Y80': { width: 77.5, height: 169.6 },
      },
      'Motorola': {
        'Moto Edge 50 Pro': { width: 72.4, height: 160.0 },
        'Moto Edge 40': { width: 72.0, height: 160.0 },
        'Moto Edge 40 Neo': { width: 69.9, height: 152.0 },
        'Moto G84': { width: 74.9, height: 165.5 },
        'Moto G54': { width: 74.9, height: 165.5 },
      },
      'Nothing': {
        'Nothing Phone 2': { width: 72.0, height: 156.7 },
        'Nothing Phone 2a': { width: 71.5, height: 153.9 },
        'Nothing Phone 1': { width: 72.0, height: 156.7 },
      },
      'Honor': {
        'Honor 200': { width: 74.1, height: 159.8 },
        'Honor 200 Pro': { width: 74.1, height: 159.8 },
        'Honor 100': { width: 74.7, height: 165.0 },
        'Honor 90': { width: 72.7, height: 153.8 },
      },
      'Sony': {
        'Xperia 1 VI': { width: 71.0, height: 165.0 },
        'Xperia 1 V': { width: 71.0, height: 165.0 },
        'Xperia 5 VI': { width: 68.0, height: 155.0 },
        'Xperia 10 VI': { width: 68.3, height: 159.0 },
      },
      'HTC': {
        'HTC U24 Pro': { width: 72.5, height: 162.0 },
        'HTC Desire 24 Pro': { width: 72.5, height: 162.0 },
      },
    };

    let currentImage = null;
    let sheetsPerPage = 2;

    function updateLabel(id, val) {
      document.getElementById(id).textContent = val;
    }

    function loadBrands() {
      const sel = document.getElementById('company');
      Object.keys(phones).sort().forEach(b => {
        const opt = document.createElement('option');
        opt.value = b;
        opt.textContent = b;
        sel.appendChild(opt);
      });
    }

    function updateModels() {
      const brand = document.getElementById('company').value;
      const modelSel = document.getElementById('model');
      modelSel.innerHTML = '<option value="">Select Model...</option>';
      if (!brand || !phones[brand]) return;
      Object.keys(phones[brand]).forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        modelSel.appendChild(opt);
      });
      updatePhoneInfo();
    }

    function updatePhoneInfo() {
      const brand = document.getElementById('company').value;
      const model = document.getElementById('model').value;
      if (!brand || !model || !phones[brand] || !phones[brand][model]) {
        document.getElementById('phoneInfo').textContent = '';
        return;
      }
      const p = phones[brand][model];
      document.getElementById('phoneInfo').textContent = `${p.width.toFixed(1)}mm × ${p.height.toFixed(1)}mm`;
    }

    function handleImageUpload() {
      const file = document.getElementById('imageInput').files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          currentImage = img;
          document.getElementById('imageStatus').style.display = 'block';
          document.getElementById('adjustments').style.display = 'block';
          document.getElementById('exportBtn').disabled = false;
          document.getElementById('clearBtn').style.display = 'inline-block';
          updatePreview();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function setSheetsPerPage(n) {
      sheetsPerPage = n;
      [1,2,3,4].forEach(i => {
        document.getElementById('btn' + i).className = 'btn btn-secondary';
      });
      document.getElementById('btn' + n).className = 'btn btn-primary';
      if (currentImage) updatePreview();
    }

    function updatePreview() {
      if (!currentImage) return;
      const brand = document.getElementById('company').value;
      const model = document.getElementById('model').value;
      if (!brand || !model || !phones[brand] || !phones[brand][model]) return;
      
      const phone = phones[brand][model];
      const offsetX = parseInt(document.getElementById('offsetX').value);
      const offsetY = parseInt(document.getElementById('offsetY').value);
      const scale = parseFloat(document.getElementById('scale').value);

      const container = document.getElementById('canvasContainer');
      container.innerHTML = '';

      const pageW = 297, pageH = 210, margin = 3, dpi = 96, mmPx = dpi / 25.4;
      const canvas = document.createElement('canvas');
      canvas.width = pageW * mmPx;
      canvas.height = pageH * mmPx;

      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let pos = [];
      const pw = phone.width * mmPx, ph = phone.height * mmPx;
      const m = margin * mmPx;

      if (sheetsPerPage === 1) pos = [{x: m, y: m}];
      else if (sheetsPerPage === 2) pos = [{x: m, y: m}, {x: m, y: m + ph + 5*mmPx}];
      else if (sheetsPerPage === 3) pos = [{x: m, y: m}, {x: m + pw + 5*mmPx, y: m}, {x: m, y: m + ph + 5*mmPx}];
      else if (sheetsPerPage === 4) pos = [{x: m, y: m}, {x: m + pw + 5*mmPx, y: m}, {x: m, y: m + ph + 5*mmPx}, {x: m + pw + 5*mmPx, y: m + ph + 5*mmPx}];

      pos.forEach(p => {
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.fillStyle = '#f5f5f5';
        ctx.fillRect(p.x, p.y, pw, ph);
        ctx.strokeRect(p.x, p.y, pw, ph);

        if (currentImage) {
          const iw = pw * scale, ih = ph * scale;
          const ix = p.x + (pw - iw) / 2 + offsetX;
          const iy = p.y + (ph - ih) / 2 + offsetY;

          ctx.save();
          ctx.beginPath();
          ctx.rect(p.x, p.y, pw, ph);
          ctx.clip();
          ctx.drawImage(currentImage, ix, iy, iw, ih);
          ctx.restore();
        }

        const mk = 8;
        ctx.strokeStyle = '#666';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y + mk);
        ctx.lineTo(p.x, p.y);
        ctx.lineTo(p.x + mk, p.y);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(p.x + pw - mk, p.y);
        ctx.lineTo(p.x + pw, p.y);
        ctx.lineTo(p.x + pw, p.y + mk);
        ctx.stroke();
      });

      container.appendChild(canvas);
    }

    function generatePDF() {
      if (!currentImage) return;
      const brand = document.getElementById('company').value;
      const model = document.getElementById('model').value;
      if (!brand || !model || !phones[brand] || !phones[brand][model]) return;

      const phone = phones[brand][model];
      const offsetX = parseInt(document.getElementById('offsetX').value);
      const offsetY = parseInt(document.getElementById('offsetY').value);
      const scale = parseFloat(document.getElementById('scale').value);

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('landscape', 'mm', 'a4');
      const margin = 3, dpi = 96, mmPx = dpi / 25.4;

      let pos = [];
      const pw = phone.width, ph = phone.height;
      const m = margin;

      if (sheetsPerPage === 1) pos = [{x: m, y: m}];
      else if (sheetsPerPage === 2) pos = [{x: m, y: m}, {x: m, y: m + ph + 5}];
      else if (sheetsPerPage === 3) pos = [{x: m, y: m}, {x: m + pw + 5, y: m}, {x: m, y: m + ph + 5}];
      else if (sheetsPerPage === 4) pos = [{x: m, y: m}, {x: m + pw + 5, y: m}, {x: m, y: m + ph + 5}, {x: m + pw + 5, y: m + ph + 5}];

      pos.forEach(p => {
        doc.setDrawColor(0);
        doc.setLineWidth(0.3);
        doc.rect(p.x, p.y, pw, ph);

        const c = document.createElement('canvas');
        c.width = pw * mmPx;
        c.height = ph * mmPx;
        const cx = c.getContext('2d');

        const iw = pw * scale, ih = ph * scale;
        const ix = (pw - iw) / 2 + offsetX / mmPx;
        const iy = (ph - ih) / 2 + offsetY / mmPx;

        cx.save();
        cx.beginPath();
        cx.rect(0, 0, pw * mmPx, ph * mmPx);
        cx.clip();
        cx.drawImage(currentImage, ix, iy, iw, ih);
        cx.restore();

        doc.addImage(c.toDataURL('image/jpeg'), 'JPEG', p.x, p.y, pw, ph);
      });

      doc.save('phone-cover.pdf');
    }

    function clearAll() {
      document.getElementById('imageInput').value = '';
      currentImage = null;
      document.getElementById('imageStatus').style.display = 'none';
      document.getElementById('adjustments').style.display = 'none';
      document.getElementById('exportBtn').disabled = true;
      document.getElementById('clearBtn').style.display = 'none';
      document.getElementById('offsetX').value = 0;
      document.getElementById('offsetY').value = 0;
      document.getElementById('scale').value = 1;
      document.getElementById('xValue').textContent = '0px';
      document.getElementById('yValue').textContent = '0px';
      document.getElementById('scaleValue').textContent = '1.00x';
      document.getElementById('canvasContainer').innerHTML = '<p style="color: #94a3b8; padding: 40px 20px;">Upload an image to see live preview</p>';
    }

    window.addEventListener('load', () => {
      loadBrands();
      setSheetsPerPage(2);
    });
  </script>
</body>
</html>
