<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Cover Insert Sheet Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #1e293b; color: white; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { margin-bottom: 10px; font-size: 28px; }
    .subtitle { color: #94a3b8; margin-bottom: 30px; }
    .content { display: grid; grid-template-columns: 350px 1fr; gap: 30px; }
    .controls { background: #334155; padding: 20px; border-radius: 10px; border: 1px solid #475569; height: fit-content; max-height: 90vh; overflow-y: auto; }
    .preview { background: #334155; padding: 20px; border-radius: 10px; border: 1px solid #475569; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; font-weight: bold; }
    select, input[type="file"] { width: 100%; background: #475569; border: 1px solid #64748b; border-radius: 8px; padding: 10px; color: white; font-size: 13px; }
    select:focus { outline: none; border-color: #2563eb; }
    input[type="range"] { width: 100%; margin-top: 8px; }
    .range-value { font-size: 11px; color: #94a3b8; margin-top: 5px; }
    .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
    .btn { padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; transition: all 0.3s; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #475569; color: white; }
    .btn-secondary:hover:not(:disabled) { background: #64748b; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .canvas-container { background: white; border-radius: 8px; border: 1px solid #cbd5e1; padding: 15px; overflow-y: auto; max-height: 600px; text-align: center; }
    canvas { max-width: 100%; margin: 10px 0; border: 1px solid #e2e8f0; }
    .upload-area { border: 2px dashed #64748b; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s; }
    .upload-area:hover { border-color: #2563eb; }
    .phone-info { font-size: 11px; color: #94a3b8; margin-top: 8px; }
    .sheets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .sheets-grid .btn { padding: 8px; font-size: 11px; }
    @media (max-width: 1024px) { .content { grid-template-columns: 1fr; } .controls { max-height: none; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>📱 Phone Cover Insert Sheet Generator</h1>
    <p class="subtitle">Create precise insert sheets for custom phone cases - All phones, 1-4 sheets, landscape, minimal margins</p>
    
    <div class="content">
      <div class="controls">
        <div class="form-group">
          <label>Phone Company</label>
          <select id="company" onchange="updateModels()"></select>
        </div>

        <div class="form-group">
          <label>Phone Model</label>
          <select id="model" onchange="updatePhoneInfo()"></select>
          <div class="phone-info" id="phoneInfo"></div>
        </div>

        <div class="form-group">
          <label>Upload Image</label>
          <div class="upload-area" id="uploadArea" onclick="document.getElementById('imageInput').click()">
            <div style="font-weight: bold; font-size: 13px;">Click to upload</div>
            <div style="font-size: 11px; color: #94a3b8;">JPG or PNG</div>
          </div>
          <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload()" style="display: none;">
          <div id="imageStatus" style="font-size: 11px; color: #4ade80; margin-top: 8px; display: none;">✓ Image loaded</div>
        </div>

        <div id="adjustments" style="display: none;">
          <div class="form-group">
            <label>Horizontal: <span id="xValue">0</span>px</label>
            <input type="range" id="offsetX" min="-100" max="100" value="0" oninput="updatePreview(); document.getElementById('xValue').textContent = this.value;">
          </div>

          <div class="form-group">
            <label>Vertical: <span id="yValue">0</span>px</label>
            <input type="range" id="offsetY" min="-100" max="100" value="0" oninput="updatePreview(); document.getElementById('yValue').textContent = this.value;">
          </div>

          <div class="form-group">
            <label>Scale: <span id="scaleValue">1.00</span>x</label>
            <input type="range" id="scale" min="0.8" max="2" step="0.1" value="1" oninput="updatePreview(); document.getElementById('scaleValue').textContent = parseFloat(this.value).toFixed(2);">
          </div>
        </div>

        <div class="form-group">
          <label>Sheets Per Page</label>
          <div class="sheets-grid">
            <button class="btn btn-secondary" onclick="setSheetsPerPage(1)" id="btn1">1</button>
            <button class="btn btn-secondary" onclick="setSheetsPerPage(2)" id="btn2">2</button>
            <button class="btn btn-secondary" onclick="setSheetsPerPage(3)" id="btn3">3</button>
            <button class="btn btn-secondary" onclick="setSheetsPerPage(4)" id="btn4">4</button>
          </div>
        </div>

        <div class="button-group">
          <button class="btn btn-secondary" id="previewBtn" onclick="togglePreview()" disabled>Preview</button>
          <button class="btn btn-primary" id="exportBtn" onclick="generatePDF()" disabled>Export PDF</button>
        </div>
      </div>

      <div class="preview">
        <div class="canvas-container" id="canvasContainer"></div>
      </div>
    </div>
  </div>

  <script>
    const phones = {

        'iPhone 14 Pro Max': { width: 77.8, height: 160.9 },
        'iPhone 13': { width: 71.5, height: 146.7 },
        'iPhone 13 Pro': { width: 71.5, height: 147.5 },

        'iPhone 13 Mini': { width: 64.2, height: 131.5 },
        'iPhone 12': { width: 71.4, height: 146.7 },
        'iPhone 12 Pro': { width: 71.4, height: 147.5 },
        'iPhone 12 Pro Max': { width: 78, height: 160.8 },
        'iPhone 12 Mini': { width: 64.2, height: 131.5 },
        'iPhone SE (3rd)': { width: 67.3, height: 138.4 },
        'iPhone SE (2nd)': { width: 67.3, height: 138.4 },
        'iPhone 11': { width: 75.7, height: 150.9 },
        'iPhone 11 Pro': { width: 71.4, height: 144.0 },
        'iPhone 11 Pro Max': { width: 77.8, height: 158.0 },
      },
      'Samsung': {
        'Galaxy S24': { width: 70.6, height: 152.2 },
        'Galaxy S24+': { width: 75.6, height: 162.8 },
        'Galaxy S24 Ultra': { width: 79.8, height: 162.8 },
        'Galaxy S23': { width: 70.9, height: 146.3 },
        'Galaxy S23+': { width: 76.1, height: 157.8 },
        'Galaxy S23 Ultra': { width: 78.6, height: 163.4 },
        'Galaxy S22': { width: 70.6, height: 146.0 },
        'Galaxy S22+': { width: 75.8, height: 157.4 },
        'Galaxy S22 Ultra': { width: 77.8, height: 163.3 },
        'Galaxy S21': { width: 71.2, height: 151.7 },
        'Galaxy S21+': { width: 75.7, height: 161.4 },
        'Galaxy S21 Ultra': { width: 75.6, height: 165.1 },
        'Galaxy A54': { width: 74.8, height: 159.9 },
        'Galaxy A53': { width: 74.8, height: 159.9 },
        'Galaxy A52': { width: 75.1, height: 159.1 },
        'Galaxy A34': { width: 70.0, height: 150.5 },
        'Galaxy A33': { width: 70.0, height: 150.9 },
        'Galaxy A32': { width: 75.1, height: 165.0 },
        'Galaxy Z Fold 5': { width: 67.1, height: 155.1 },

        'Galaxy Z Flip 5': { width: 71.9, height: 165.2 },

      },
      'Google': {

      },
      'OnePlus': {
        'OnePlus 12': { width: 75.1, height: 160.8 },
        'OnePlus 12R': { width: 75.7, height: 160.5 },
        'OnePlus 11': { width: 72.1, height: 150.4 },
        'OnePlus 11 Pro': { width: 75.9, height: 160.2 },
        'OnePlus 10': { width: 72.9, height: 151.4 },

        'OnePlus 10T': { width: 75.1, height: 160.8 },
        'OnePlus 9': { width: 72.9, height: 151.4 },
        'OnePlus 9 Pro': { width: 73.2, height: 160.2 },
      },
      'Xiaomi': {
        'Xiaomi 14': { width: 71.5, height: 152.8 },
        'Xiaomi 14 Ultra': { width: 75.3, height: 164.0 },
        'Xiaomi 13': { width: 71.6, height: 152.8 },
        'Xiaomi 13 Ultra': { width: 75.3, height: 164.0 },
        'Xiaomi 13 Pro': { width: 75.3, height: 164.0 },
        'Xiaomi 12': { width: 69.9, height: 151.8 },
        'Xiaomi 12S Ultra': { width: 75.3, height: 164.0 },
        'Xiaomi 12 Pro': { width: 75.3, height: 164.0 },
        'Redmi Note 13': { width: 77.9, height: 175.8 },
        'Redmi Note 12': { width: 77.9, height: 175.8 },
        'Poco X6': { width: 72.8, height: 159.6 },
        'Poco X5': { width: 71.3, height: 163.3 },
      },
      'OPPO': {
        'OPPO Find X7': { width: 73.0, height: 150.5 },
        'OPPO Find X6': { width: 73.0, height: 150.5 },
        'OPPO Reno 11': { width: 71.6, height: 155.0 },
        'OPPO Reno 10': { width: 71.6, height: 155.0 },
        'OPPO A79': { width: 74.7, height: 165.5 },
        'OPPO A78': { width: 74.7, height: 165.5 },
      },
      'Vivo': {
        'Vivo X100': { width: 75.2, height: 165.0 },
        'Vivo X90': { width: 75.2, height: 165.0 },
        'Vivo Y100': { width: 74.7, height: 164.7 },
        'Vivo Y80': { width: 77.5, height: 169.6 },
      },
      'Motorola': {
        'Moto Edge 50 Pro': { width: 72.4, height: 160.0 },
        'Moto Edge 40': { width: 72.0, height: 160.0 },
        'Moto G84': { width: 74.9, height: 165.5 },
        'Moto G54': { width: 74.9, height: 165.5 },
      },
      'Nothing': {
        'Nothing Phone 2': { width: 72.0, height: 156.7 },
        'Nothing Phone 1': { width: 72.0, height: 156.7 },
      },
      'Realme': {
        'Realme 12': { width: 72.3, height: 154.5 },
        'Realme 11': { width: 72.3, height: 154.5 },
        'Realme 10': { width: 74.4, height: 162.5 },
        'Realme GT': { width: 74.4, height: 160.8 },
      },
      'Honor': {
        'Honor 200': { width: 74.1, height: 159.8 },
        'Honor 200 Pro': { width: 74.1, height: 159.8 },
        'Honor 100': { width: 74.7, height: 165.0 },
        'Honor 90': { width: 72.7, height: 153.8 },
      },
      'HTC': {
        'HTC U24 Pro': { width: 72.5, height: 162.0 },
        'HTC Desire 24 Pro': { width: 72.5, height: 162.0 },
      },
      'Sony': {
        'Sony Xperia 1 VI': { width: 71.0, height: 165.0 },
        'Sony Xperia 1 V': { width: 71.0, height: 165.0 },
        'Sony Xperia 5 VI': { width: 68.0, height: 155.0 },
        'Sony Xperia 10 VI': { width: 68.3, height: 159.0 },
      },
    };

    let currentImage = null;
    let sheetsPerPage = 2;

    function initializePage() {
      const companySelect = document.getElementById('company');
      Object.keys(phones).forEach(company => {
        const option = document.createElement('option');
        option.value = company;
        option.textContent = company;
        companySelect.appendChild(option);
      });
      updateModels();
      setSheetsPerPage(2);
    }

    function updateModels() {
      const company = document.getElementById('company').value;
      const modelSelect = document.getElementById('model');
      modelSelect.innerHTML = '';
      
      const models = phones[company];
      Object.keys(models).forEach(model => {
        const option = document.createElement('option');
        option.value = model;
        option.textContent = model;
        modelSelect.appendChild(option);
      });
      
      updatePhoneInfo();
    }

    function updatePhoneInfo() {
      const company = document.getElementById('company').value;
      const model = document.getElementById('model').value;
      const phone = phones[company][model];
      if (phone) {
        document.getElementById('phoneInfo').textContent = `${phone.width.toFixed(1)}mm × ${phone.height.toFixed(1)}mm`;
      }
    }

    function handleImageUpload() {
      const file = document.getElementById('imageInput').files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          currentImage = img;
          document.getElementById('imageStatus').style.display = 'block';
          document.getElementById('adjustments').style.display = 'block';
          document.getElementById('previewBtn').disabled = false;
          document.getElementById('exportBtn').disabled = false;
          updatePreview();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function setSheetsPerPage(num) {
      sheetsPerPage = num;
      ['btn1', 'btn2', 'btn3', 'btn4'].forEach(id => {
        document.getElementById(id).className = 'btn btn-secondary';
      });
      document.getElementById('btn' + num).className = 'btn btn-primary';
      if (currentImage) updatePreview();
    }

    function updatePreview() {
      if (!currentImage) return;

      const company = document.getElementById('company').value;
      const model = document.getElementById('model').value;
      const phone = phones[company][model];
      const offsetX = parseInt(document.getElementById('offsetX').value);
      const offsetY = parseInt(document.getElementById('offsetY').value);
      const scale = parseFloat(document.getElementById('scale').value);

      const container = document.getElementById('canvasContainer');
      container.innerHTML = '';

      const pageWidth = 297;
      const pageHeight = 210;
      const margin = 3;

      const dpi = 96;
      const mmToPixel = dpi / 25.4;

      const canvas = document.createElement('canvas');
      canvas.width = pageWidth * mmToPixel;
      canvas.height = pageHeight * mmToPixel;

      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let positions = [];
      const phoneWidth = phone.width * mmToPixel;
      const phoneHeight = phone.height * mmToPixel;

      if (sheetsPerPage === 1) {
        positions = [{ x: margin * mmToPixel, y: margin * mmToPixel }];
      } else if (sheetsPerPage === 2) {
        positions = [
          { x: margin * mmToPixel, y: margin * mmToPixel },
          { x: margin * mmToPixel, y: margin * mmToPixel + phoneHeight + 5 * mmToPixel }
        ];
      } else if (sheetsPerPage === 3) {
        positions = [
          { x: margin * mmToPixel, y: margin * mmToPixel },
          { x: margin * mmToPixel + phoneWidth + 5 * mmToPixel, y: margin * mmToPixel },
          { x: margin * mmToPixel, y: margin * mmToPixel + phoneHeight + 5 * mmToPixel }
        ];
      } else if (sheetsPerPage === 4) {
        positions = [
          { x: margin * mmToPixel, y: margin * mmToPixel },
          { x: margin * mmToPixel + phoneWidth + 5 * mmToPixel, y: margin * mmToPixel },
          { x: margin * mmToPixel, y: margin * mmToPixel + phoneHeight + 5 * mmToPixel },
          { x: margin * mmToPixel + phoneWidth + 5 * mmToPixel, y: margin * mmToPixel + phoneHeight + 5 * mmToPixel }
        ];
      }

      positions.forEach(pos => {
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.fillStyle = '#f5f5f5';
        ctx.fillRect(pos.x, pos.y, phoneWidth, phoneHeight);
        ctx.strokeRect(pos.x, pos.y, phoneWidth, phoneHeight);

        if (currentImage) {
          const imgWidth = phoneWidth * scale;
          const imgHeight = phoneHeight * scale;
          const imgX = pos.x + (phoneWidth - imgWidth) / 2 + offsetX;
          const imgY = pos.y + (phoneHeight - imgHeight) / 2 + offsetY;

          ctx.save();
          ctx.beginPath();
          ctx.rect(pos.x, pos.y, phoneWidth, phoneHeight);
          ctx.clip();
          ctx.drawImage(currentImage, imgX, imgY, imgWidth, imgHeight);
          ctx.restore();
        }

        const markLen = 8;
        ctx.strokeStyle = '#666';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y + markLen);
        ctx.lineTo(pos.x, pos.y);
        ctx.lineTo(pos.x + markLen, pos.y);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(pos.x + phoneWidth - markLen, pos.y);
        ctx.lineTo(pos.x + phoneWidth, pos.y);
        ctx.lineTo(pos.x + phoneWidth, pos.y + markLen);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y + phoneHeight - markLen);
        ctx.lineTo(pos.x, pos.y + phoneHeight);
        ctx.lineTo(pos.x + markLen, pos.y + phoneHeight);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(pos.x + phoneWidth - markLen, pos.y + phoneHeight);
        ctx.lineTo(pos.x + phoneWidth, pos.y + phoneHeight);
        ctx.lineTo(pos.x + phoneWidth, pos.y + phoneHeight - markLen);
        ctx.stroke();
      });

      container.appendChild(canvas);
    }

    function togglePreview() {
      updatePreview();
    }

    function generatePDF() {
      if (!currentImage) return;

      const company = document.getElementById('company').value;
      const model = document.getElementById('model').value;
      const phone = phones[company][model];
      const offsetX = parseInt(document.getElementById('offsetX').value);
      const offsetY = parseInt(document.getElementById('offsetY').value);
      const scale = parseFloat(document.getElementById('scale').value);

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('landscape', 'mm', 'a4');
      const pageWidth = 297;
      const pageHeight = 210;
      const margin = 3;

      const dpi = 96;
      const mmToPixel = dpi / 25.4;

      let positions = [];
      const phoneWidth = phone.width;
      const phoneHeight = phone.height;

      if (sheetsPerPage === 1) {
        positions = [{ x: margin, y: margin }];
      } else if (sheetsPerPage === 2) {
        positions = [
          { x: margin, y: margin },
          { x: margin, y: margin + phoneHeight + 5 }
        ];
      } else if (sheetsPerPage === 3) {
        positions = [
          { x: margin, y: margin },
          { x: margin + phoneWidth + 5, y: margin },
          { x: margin, y: margin + phoneHeight + 5 }
        ];
      } else if (sheetsPerPage === 4) {
        positions = [
          { x: margin, y: margin },
          { x: margin + phoneWidth + 5, y: margin },
          { x: margin, y: margin + phoneHeight + 5 },
          { x: margin + phoneWidth + 5, y: margin + phoneHeight + 5 }
        ];
      }

      positions.forEach(pos => {
        doc.setDrawColor(0);
        doc.setLineWidth(0.3);
        doc.rect(pos.x, pos.y, phoneWidth, phoneHeight);

        const canvas = document.createElement('canvas');
        canvas.width = phoneWidth * mmToPixel;
        canvas.height = phoneHeight * mmToPixel;
        const ctx = canvas.getContext('2d');

        const imgWidth = phoneWidth * scale;
        const imgHeight = phoneHeight * scale;
        const imgX = (phoneWidth - imgWidth) / 2 + offsetX / mmToPixel;
        const imgY = (phoneHeight - imgHeight) / 2 + offsetY / mmToPixel;

        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, phoneWidth * mmToPixel, phoneHeight * mmToPixel);
        ctx.clip();
        ctx.drawImage(currentImage, imgX, imgY, imgWidth, imgHeight);
        ctx.restore();

        const imgData = canvas.toDataURL('image/jpeg');
        doc.addImage(imgData, 'JPEG', pos.x, pos.y, phoneWidth, phoneHeight);
      });

      doc.save('phone-cover-inserts.pdf');
    }

    // Initialize on page load
    window.addEventListener('load', initializePage);
  </script>
</body>
</html>
