<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Cover Insert Sheet Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #1e293b; color: white; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { margin-bottom: 10px; font-size: 28px; }
    .subtitle { color: #94a3b8; margin-bottom: 30px; font-size: 14px; }
    .content { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
    .controls { background: #334155; padding: 20px; border-radius: 10px; border: 1px solid #475569; }
    .preview { background: #334155; padding: 20px; border-radius: 10px; border: 1px solid #475569; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 6px; font-weight: bold; }
    select, input[type="file"] { width: 100%; background: #475569; border: 1px solid #64748b; border-radius: 6px; padding: 8px; color: white; font-size: 12px; }
    input[type="range"] { width: 100%; margin-top: 6px; }
    .btn { padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }
    .btn-secondary { background: #475569; color: white; }
    .btn-secondary:hover { background: #64748b; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
    .sheets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .canvas-container { background: white; border-radius: 8px; border: 1px solid #cbd5e1; padding: 10px; max-height: 500px; overflow-y: auto; }
    canvas { max-width: 100%; margin: 10px 0; }
    .upload-area { border: 2px dashed #64748b; border-radius: 8px; padding: 15px; text-align: center; cursor: pointer; }
    .upload-area:hover { border-color: #2563eb; }
    .phone-info { font-size: 11px; color: #94a3b8; margin-top: 6px; }
    .status { font-size: 11px; color: #4ade80; margin-top: 6px; }
    @media (max-width: 768px) { .content { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>📱 Phone Cover Insert Sheet Generator</h1>
    <p class="subtitle">Create precise insert sheets - Landscape, minimal margins, 1-4 sheets per page</p>
    
    <div class="content">
      <div class="controls">
        <div class="form-group">
          <label>Phone Brand</label>
          <select id="company" onchange="updateModels()">
            <option>Apple</option>
            <option>Samsung</option>
            <option>Google</option>
            <option>OnePlus</option>
            <option>Xiaomi</option>
            <option>OPPO</option>
            <option>Vivo</option>
            <option>Motorola</option>
            <option>Nothing</option>
            <option>Realme</option>
            <option>Honor</option>
            <option>HTC</option>
            <option>Sony</option>
          </select>
        </div>

        <div class="form-group">
          <label>Phone Model</label>
          <select id="model" onchange="updatePhoneInfo()"></select>
          <div class="phone-info" id="phoneInfo"></div>
        </div>

        <div class="form-group">
          <label>Upload Image</label>
          <div class="upload-area" onclick="document.getElementById('imageInput').click()">
            <div style="font-size: 12px;">Click to upload</div>
            <div style="font-size: 10px; color: #94a3b8;">JPG or PNG</div>
          </div>
          <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload()" style="display: none;">
          <div id="imageStatus" class="status" style="display: none;">✓ Image loaded</div>
        </div>

        <div id="adjustments" style="display: none;">
          <div class="form-group">
            <label>Horizontal: <span id="xValue">0</span>px</label>
            <input type="range" id="offsetX" min="-100" max="100" value="0" oninput="document.getElementById('xValue').textContent = this.value; updatePreview();">
          </div>

          <div class="form-group">
            <label>Vertical: <span id="yValue">0</span>px</label>
            <input type="range" id="offsetY" min="-100" max="100" value="0" oninput="document.getElementById('yValue').textContent = this.value; updatePreview();">
          </div>

          <div class="form-group">
            <label>Scale: <span id="scaleValue">1.00</span>x</label>
            <input type="range" id="scale" min="0.8" max="2" step="0.1" value="1" oninput="document.getElementById('scaleValue').textContent = parseFloat(this.value).toFixed(2); updatePreview();">
          </div>
        </div>

        <div class="form-group">
          <label>Sheets Per Page</label>
          <div class="sheets-grid">
            <button class="btn btn-secondary" onclick="setSheetsPerPage(1)" id="btn1">1</button>
            <button class="btn btn-secondary" onclick="setSheetsPerPage(2)" id="btn2">2</button>
            <button class="btn btn-secondary" onclick="setSheetsPerPage(3)" id="btn3">3</button>
            <button class="btn btn-secondary" onclick="setSheetsPerPage(4)" id="btn4">4</button>
          </div>
        </div>

        <div class="button-group">
          <button class="btn btn-secondary" onclick="updatePreview()" disabled id="previewBtn">Preview</button>
          <button class="btn btn-primary" onclick="generatePDF()" disabled id="exportBtn">Export PDF</button>
        </div>
      </div>

      <div class="preview">
        <div class="canvas-container" id="canvasContainer"></div>
      </div>
    </div>
  </div>

  <script>
const phones = {
  'Apple': {'iPhone 15':71.6x147.8,'iPhone 15 Pro':71.6x147.8,'iPhone 15 Plus':77.8x160.9,'iPhone 15 Pro Max':77.8x160.9,'iPhone 14':71.5x146.7,'iPhone 14 Pro':71.5x147.5,'iPhone 14 Plus':77.8x160.9,'iPhone 14 Pro Max':77.8x160.9,'iPhone 13':71.5x146.7,'iPhone 13 Pro':71.5x147.5,'iPhone 13 Pro Max':77.8x160.8,'iPhone 13 Mini':64.2x131.5,'iPhone 12':71.4x146.7,'iPhone 12 Pro':71.4x147.5,'iPhone 12 Pro Max':78x160.8,'iPhone 12 Mini':64.2x131.5,'iPhone SE (3rd)':67.3x138.4,'iPhone SE (2nd)':67.3x138.4,'iPhone 11':75.7x150.9,'iPhone 11 Pro':71.4x144.0,'iPhone 11 Pro Max':77.8x158.0},
  'Samsung': {'Galaxy S24':70.6x152.2,'Galaxy S24+':75.6x162.8,'Galaxy S24 Ultra':79.8x162.8,'Galaxy S23':70.9x146.3,'Galaxy S23+':76.1x157.8,'Galaxy S23 Ultra':78.6x163.4,'Galaxy S22':70.6x146.0,'Galaxy S22+':75.8x157.4,'Galaxy S22 Ultra':77.8x163.3,'Galaxy S21':71.2x151.7,'Galaxy S21+':75.7x161.4,'Galaxy S21 Ultra':75.6x165.1,'Galaxy A54':74.8x159.9,'Galaxy A53':74.8x159.9,'Galaxy A52':75.1x159.1,'Galaxy A34':70.0x150.5,'Galaxy A33':70.0x150.9,'Galaxy A32':75.1x165.0,'Galaxy Z Fold 5':67.1x155.1,'Galaxy Z Fold 4':67.1x155.1,'Galaxy Z Flip 5':71.9x165.2,'Galaxy Z Flip 4':71.9x165.2},
  'Google': {'Pixel 8':70.8x150.5,'Pixel 8 Pro':73.0x162.6,'Pixel 7':71.8x152.0,'Pixel 7 Pro':75.9x163.9,'Pixel 7a':72.9x152.0,'Pixel 6':71.8x152.2,'Pixel 6 Pro':75.9x163.9,'Pixel 6a':71.8x152.2,'Pixel 5a':72.6x154.9,'Pixel Fold':66.0x148.0},
  'OnePlus': {'OnePlus 12':75.1x160.8,'OnePlus 12R':75.7x160.5,'OnePlus 11':72.1x150.4,'OnePlus 11 Pro':75.9x160.2,'OnePlus 10':72.9x151.4,'OnePlus 10 Pro':73.3x160.5,'OnePlus 10T':75.1x160.8,'OnePlus 9':72.9x151.4,'OnePlus 9 Pro':73.2x160.2},
  'Xiaomi': {'Xiaomi 14':71.5x152.8,'Xiaomi 14 Ultra':75.3x164.0,'Xiaomi 13':71.6x152.8,'Xiaomi 13 Ultra':75.3x164.0,'Xiaomi 13 Pro':75.3x164.0,'Xiaomi 12':69.9x151.8,'Xiaomi 12S Ultra':75.3x164.0,'Xiaomi 12 Pro':75.3x164.0,'Redmi Note 13':77.9x175.8,'Redmi Note 12':77.9x175.8,'Poco X6':72.8x159.6,'Poco X5':71.3x163.3},
  'OPPO': {'OPPO Find X7':73.0x150.5,'OPPO Find X6':73.0x150.5,'OPPO Reno 11':71.6x155.0,'OPPO Reno 10':71.6x155.0,'OPPO A79':74.7x165.5,'OPPO A78':74.7x165.5},
  'Vivo': {'Vivo X100':75.2x165.0,'Vivo X90':75.2x165.0,'Vivo Y100':74.7x164.7,'Vivo Y80':77.5x169.6},
  'Motorola': {'Moto Edge 50 Pro':72.4x160.0,'Moto Edge 40':72.0x160.0,'Moto G84':74.9x165.5,'Moto G54':74.9x165.5},
  'Nothing': {'Nothing Phone 2':72.0x156.7,'Nothing Phone 1':72.0x156.7},
  'Realme': {'Realme 12':72.3x154.5,'Realme 11':72.3x154.5,'Realme 10':74.4x162.5,'Realme GT':74.4x160.8},
  'Honor': {'Honor 200':74.1x159.8,'Honor 200 Pro':74.1x159.8,'Honor 100':74.7x165.0,'Honor 90':72.7x153.8},
  'HTC': {'HTC U24 Pro':72.5x162.0,'HTC Desire 24 Pro':72.5x162.0},
  'Sony': {'Sony Xperia 1 VI':71.0x165.0,'Sony Xperia 1 V':71.0x165.0,'Sony Xperia 5 VI':68.0x155.0,'Sony Xperia 10 VI':68.3x159.0}
};

let currentImage = null;
let sheetsPerPage = 2;

function updateModels(){const c=document.getElementById('company').value;const m=document.getElementById('model');m.innerHTML='';Object.keys(phones[c]).forEach(model=>{const o=document.createElement('option');o.value=model;o.textContent=model;m.appendChild(o)});updatePhoneInfo()}

function updatePhoneInfo(){const c=document.getElementById('company').value;const m=document.getElementById('model').value;const p=phones[c][m];if(p){const[w,h]=p.split('x').map(parseFloat);document.getElementById('phoneInfo').textContent=`${w.toFixed(1)}mm × ${h.toFixed(1)}mm`}}

function handleImageUpload(){const f=document.getElementById('imageInput').files[0];if(!f)return;const r=new FileReader();r.onload=e=>{const i=new Image();i.onload=()=>{currentImage=i;document.getElementById('imageStatus').style.display='block';document.getElementById('adjustments').style.display='block';document.getElementById('previewBtn').disabled=false;document.getElementById('exportBtn').disabled=false;updatePreview()};i.src=e.target.result};r.readAsDataURL(f)}

function setSheetsPerPage(n){sheetsPerPage=n;['btn1','btn2','btn3','btn4'].forEach(id=>{document.getElementById(id).className='btn btn-secondary'});document.getElementById('btn'+n).className='btn btn-primary';if(currentImage)updatePreview()}

function updatePreview(){if(!currentImage)return;const c=document.getElementById('company').value;const m=document.getElementById('model').value;const[pw,ph]=phones[c][m].split('x').map(parseFloat);const ox=parseInt(document.getElementById('offsetX').value);const oy=parseInt(document.getElementById('offsetY').value);const s=parseFloat(document.getElementById('scale').value);const cont=document.getElementById('canvasContainer');cont.innerHTML='';const pageW=297,pageH=210,margin=3,dpi=96,mmToPx=dpi/25.4;const canvas=document.createElement('canvas');canvas.width=pageW*mmToPx;canvas.height=pageH*mmToPx;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);let pos=[];const phoneW=pw*mmToPx,phoneH=ph*mmToPx;if(sheetsPerPage===1){pos=[{x:margin*mmToPx,y:margin*mmToPx}]}else if(sheetsPerPage===2){pos=[{x:margin*mmToPx,y:margin*mmToPx},{x:margin*mmToPx,y:margin*mmToPx+phoneH+5*mmToPx}]}else if(sheetsPerPage===3){pos=[{x:margin*mmToPx,y:margin*mmToPx},{x:margin*mmToPx+phoneW+5*mmToPx,y:margin*mmToPx},{x:margin*mmToPx,y:margin*mmToPx+phoneH+5*mmToPx}]}else{pos=[{x:margin*mmToPx,y:margin*mmToPx},{x:margin*mmToPx+phoneW+5*mmToPx,y:margin*mmToPx},{x:margin*mmToPx,y:margin*mmToPx+phoneH+5*mmToPx},{x:margin*mmToPx+phoneW+5*mmToPx,y:margin*mmToPx+phoneH+5*mmToPx}]};pos.forEach(p=>{ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.fillStyle='#f5f5f5';ctx.fillRect(p.x,p.y,phoneW,phoneH);ctx.strokeRect(p.x,p.y,phoneW,phoneH);if(currentImage){const imgW=phoneW*s,imgH=phoneH*s,imgX=p.x+(phoneW-imgW)/2+ox,imgY=p.y+(phoneH-imgH)/2+oy;ctx.save();ctx.beginPath();ctx.rect(p.x,p.y,phoneW,phoneH);ctx.clip();ctx.drawImage(currentImage,imgX,imgY,imgW,imgH);ctx.restore()};const mk=8;ctx.strokeStyle='#666';ctx.lineWidth=0.8;ctx.beginPath();ctx.moveTo(p.x,p.y+mk);ctx.lineTo(p.x,p.y);ctx.lineTo(p.x+mk,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x+phoneW-mk,p.y);ctx.lineTo(p.x+phoneW,p.y);ctx.lineTo(p.x+phoneW,p.y+mk);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y+phoneH-mk);ctx.lineTo(p.x,p.y+phoneH);ctx.lineTo(p.x+mk,p.y+phoneH);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x+phoneW-mk,p.y+phoneH);ctx.lineTo(p.x+phoneW,p.y+phoneH);ctx.lineTo(p.x+phoneW,p.y+phoneH-mk);ctx.stroke()});cont.appendChild(canvas)}

function generatePDF(){if(!currentImage)return;const c=document.getElementById('company').value;const m=document.getElementById('model').value;const[pw,ph]=phones[c][m].split('x').map(parseFloat);const ox=parseInt(document.getElementById('offsetX').value);const oy=parseInt(document.getElementById('offsetY').value);const s=parseFloat(document.getElementById('scale').value);const{jsPDF}=window.jspdf;const doc=new jsPDF('landscape','mm','a4');const margin=3,dpi=96,mmToPx=dpi/25.4;let pos=[];if(sheetsPerPage===1){pos=[{x:margin,y:margin}]}else if(sheetsPerPage===2){pos=[{x:margin,y:margin},{x:margin,y:margin+ph+5}]}else if(sheetsPerPage===3){pos=[{x:margin,y:margin},{x:margin+pw+5,y:margin},{x:margin,y:margin+ph+5}]}else{pos=[{x:margin,y:margin},{x:margin+pw+5,y:margin},{x:margin,y:margin+ph+5},{x:margin+pw+5,y:margin+ph+5}]};pos.forEach(p=>{doc.setDrawColor(0);doc.setLineWidth(0.3);doc.rect(p.x,p.y,pw,ph);const canv=document.createElement('canvas');canv.width=pw*mmToPx;canv.height=ph*mmToPx;const ctx=canv.getContext('2d');const imgW=pw*s,imgH=ph*s,imgX=(pw-imgW)/2+ox/mmToPx,imgY=(ph-imgH)/2+oy/mmToPx;ctx.save();ctx.beginPath();ctx.rect(0,0,pw*mmToPx,ph*mmToPx);ctx.clip();ctx.drawImage(currentImage,imgX,imgY,imgW,imgH);ctx.restore();const imgData=canv.toDataURL('image/jpeg');doc.addImage(imgData,'JPEG',p.x,p.y,pw,ph)});doc.save('phone-cover.pdf')}

document.getElementById('model').onchange=updatePhoneInfo;window.addEventListener('load',()=>{updateModels();setSheetsPerPage(2)});
  </script>
</body>
</html>
